services:
  planify:
    build: .
    env_file:
      - .env
    environment:
      PLANIFY_ENV: development
      PLANIFY_DEBUG: "false"
      PLANIFY_MICROSERVICES_ENABLED: "false"
      PLANIFY_ENABLE_NOTIFICATION_SCHEDULER: "true"
      PLANIFY_SECRET_KEY: ${PLANIFY_SECRET_KEY:?Configura PLANIFY_SECRET_KEY en .env}
      PLANIFY_DATABASE_URL: sqlite:////data/planify.db
      PORT: "8000"
    ports:
      - "127.0.0.1:5000:8000"
    volumes:
      - planify-monolith-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  planify-monolith-data:
